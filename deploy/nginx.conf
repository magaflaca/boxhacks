server {
    listen 80;
    server_name box.hacks.win;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name box.hacks.win;

    ssl_certificate /etc/letsencrypt/live/box.hacks.win/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/box.hacks.win/privkey.pem;

    client_max_body_size 5g;
    client_body_timeout 300s;

    location / {
        include snippets/boxhacks-proxy.conf;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# Llega a traves del proxy de Cloudflare: solo admite las partes de las subidas troceadas.
server {
    listen 443 ssl;
    server_name boxup.hacks.win;

    ssl_certificate /etc/letsencrypt/live/box.hacks.win/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/box.hacks.win/privkey.pem;

    client_max_body_size 100m;
    client_body_timeout 300s;

    location ~ ^/api/uploads/[^/]+/chunks/\d+$ {
        include snippets/boxhacks-proxy.conf;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
    }
    location / {
        return 404;
    }
}
